bind=SUPER,r,reload_config
bind=SUPER+CTRL+SHIFT,q,quit
bind=SUPER,Escape,spawn,swaylock

bind=SUPER,Return,spawn,foot
bind=SUPER,q,killclient
bind=SUPER,space,spawn,rofi -show drun

bind=SUPER,m,setlayout,monocle
bind=SUPER,t,setlayout,tile
bind=SUPER,d,setlayout,deck
bind=SUPER,s,setlayout,scroller

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,p,focusstack,next
bind=SUPER,n,focusstack,prev

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,p,exchange_stack_client,prev
bind=SUPER+SHIFT,n,exchange_stack_client,next

bind=SUPER,bracketright,resizewin,+50,+0
bind=SUPER,bracketleft,resizewin,-50,+0
bind=SUPER+SHIFT,bracketright,resizewin,+0,+50
bind=SUPER+SHIFT,bracketleft,resizewin,+0,-50

bind=SUPER+CTRL,h,movewin,-50,+0
bind=SUPER+CTRL,j,movewin,+0,+50
bind=SUPER+CTRL,k,movewin,+0,-50
bind=SUPER+CTRL,l,movewin,+50,+0

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

disable_trackpad=0
tap_to_click=1
tap_and_drag = 1
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.25
button_map = 0

gesturebind=none,left,3,focusdir,right
gesturebind=none,down,3,focusdir,up
gesturebind=none,up,3,focusdir,down
gesturebind=none,right,3,focusdir,left

gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0

bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0

scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=1
edge_scroller_pointer_focus=0

bind=SUPER,f,togglefloating
bind=SUPER+SHIFT,f,toggle_all_floating

exec-once=awww-daemon
exec-once=awww img ~/.local/share/wallpaper
exec-once=quickshell

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +5%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 5%-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-

bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
